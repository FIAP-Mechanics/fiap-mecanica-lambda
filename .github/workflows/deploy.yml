name: Deploy

on:
  push:
    branches:
      - homologacao
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_db_password: ${{ secrets.AUTH_CPF_DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=auth-cpf/${ENVIRONMENT}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Provision ECR repository
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var-file="envs/${ENVIRONMENT}.tfvars" -target=aws_ecr_repository.this

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: infra
        run: |
          repo=$(terraform output -raw ecr_repository_url)
          tag=${GITHUB_SHA::12}
          docker build -t "$repo:$tag" ..
          docker push "$repo:$tag"
          echo "TF_VAR_image_tag=$tag" >> "$GITHUB_ENV"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false -var-file="envs/${ENVIRONMENT}.tfvars"

      - name: Smoke test (invoke)
        run: |
          aws lambda invoke --function-name "mecanica-auth-cpf-${ENVIRONMENT}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"body":"{\"cpf\":\"111.111.111-11\"}","headers":{}}' response.json
          grep -q '"statusCode":400' response.json

  publish-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-auth-cpf:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/mecanica-auth-cpf:latest
